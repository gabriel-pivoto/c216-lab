name: CI Backend

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Configura o Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instala o Poetry
        run: pipx install poetry

      - name: Instala as dependencias
        run: poetry install

      - name: Verifica o lint
        run: poetry run ruff check .

      - name: Verifica a formatacao
        run: poetry run ruff format --check .

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: c216
          POSTGRES_PASSWORD: c216
          POSTGRES_DB: c216_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U c216 -d c216_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://c216:c216@localhost:5432/c216_test
      TEST_DATABASE_URL: postgresql+psycopg://c216:c216@localhost:5432/c216_test

    steps:
      - uses: actions/checkout@v4

      - name: Configura o Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instala o Poetry
        run: pipx install poetry

      - name: Instala as dependencias
        run: poetry install

      - name: Roda os testes unitarios
        run: poetry run pytest -v tests/unit

      - name: Aplica as migrations
        run: poetry run alembic upgrade head

      - name: Roda os testes de integracao
        run: poetry run pytest -v tests/integration
