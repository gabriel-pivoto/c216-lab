name: CI E2E

on:
  push:
    paths:
      - "backend/**"
      - "frontend/**"
      - "docker-compose.yml"
      - ".env.example"
      - ".github/workflows/ci-e2e.yml"
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - "docker-compose.yml"
      - ".env.example"
      - ".github/workflows/ci-e2e.yml"

jobs:
  e2e:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Cria o arquivo de ambiente
        run: cp .env.example .env

      - name: Sobe frontend, backend e PostgreSQL
        run: docker compose up -d --build --wait

      - name: Configura o Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instala as dependencias
        working-directory: frontend
        run: npm ci

      - name: Instala o Chromium do Playwright
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Roda os testes E2E
        working-directory: frontend
        run: npm run test:e2e

      - name: Mostra os logs dos containers
        if: ${{ failure() }}
        run: docker compose logs

      - name: Publica o relatorio do Playwright
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
